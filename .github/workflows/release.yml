name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/$arch/" ./cmd/devstationone-server ./cmd/devstationone-runtime ./cmd/devstationone-admin
            tar -czf "dist/devstationone_${VER}_linux_${arch}.tar.gz" \
              -C "dist/$arch" devstationone-server devstationone-runtime devstationone-admin
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
