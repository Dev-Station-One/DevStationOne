services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devstation
      POSTGRES_PASSWORD: devstation
      POSTGRES_DB: devstation
    ports:
      - "55432:5432"
    volumes:
      - devstation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstation"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Real test database for internal/dbconnectors' MySQL connector
  # (docs/IMPLEMENTATION_PLAN.md Slice 7 acceptance: connect to each
  # supported engine using a real test database).
  dbtest-mysql:
    image: mysql:8.4
    # Binary logging is on by default and blocks non-SUPER users from
    # creating triggers/functions ("you might want to use
    # log_bin_trust_function_creators"); this is a disposable test
    # database with no replication use, so just turn logging off.
    command: --disable-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: devstation
      MYSQL_DATABASE: devstation
      MYSQL_USER: devstation
      MYSQL_PASSWORD: devstation
    ports:
      - "53306:3306"
    volumes:
      - devstation-dbtest-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devstation", "-pdevstation"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Real test database for internal/dbconnectors' MSSQL connector.
  dbtest-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Devstation1!"
    ports:
      - "51433:1433"
    volumes:
      - devstation-dbtest-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  devstation-postgres:
  devstation-dbtest-mysql:
  devstation-dbtest-mssql:
