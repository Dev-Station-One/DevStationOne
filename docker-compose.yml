services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devstation
      POSTGRES_PASSWORD: devstation
      POSTGRES_DB: devstation
    ports:
      - "55432:5432"
    volumes:
      - devstation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devstation-postgres:
