      description: Live RPC. filter is a raw SQL boolean expression appended after WHERE, not a parameterized value — deliberate, the same arbitrary-SQL trust model as the SQL Editor (docs/DECISIONS.md ADR-021/023).
      tags: [Databases]
      operationId: listDatabaseRows
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
        - name: schema
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 100, capped at 5000.
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          description: A column name, identifier-quoted by the runtime.
          schema:
            type: string
        - name: sort_desc
          in: query
          schema:
            type: boolean
        - name: filter
          in: query
          description: Raw SQL boolean expression.
          schema:
            type: string
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBRowsResult"
        "400":
          description: limit or offset is not a valid non-negative integer
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
    patch:
      summary: Commit staged row inserts/updates/deletes
      description: Every edit is applied as a parameterized statement — column values are always bound, never interpolated, regardless of the raw-SQL filter/query exceptions elsewhere in this API.
      tags: [Databases]
      operationId: commitDatabaseRows
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
        - name: schema
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              properties:
                edits:
                  type: array
                  items:
                    $ref: "#/components/schemas/DBRowEdit"
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid request body, or an edit's op isn't insert/update/delete
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
