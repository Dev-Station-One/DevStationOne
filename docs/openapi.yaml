    post:
      summary: Run arbitrary SQL (the SQL Editor)
      description: Runs sql verbatim — arbitrary SQL, the same deliberate trust model as the terminal (docs/SECURITY.md, ADR-021). A keyword sniff routes it to Exec (is_exec, rows_affected) or Query (columns/rows, capped at limit).
      tags: [Databases]
      operationId: runDatabaseQuery
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Caps rows read back for a SELECT-shaped statement. Defaults to 100, capped at 5000.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
      responses:
        "200":
          description: Query/exec result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBRowsResult"
        "400":
          description: sql is empty, or limit is invalid
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/databases/{connectionID}/principals:
    get:
      summary: List a connection's database-level users/logins/roles
      description: Live RPC. 400 for a sqlite connection (docs/DECISIONS.md ADR-024) — sqlite has no server-side users/roles.
      tags: [Databases]
      operationId: listDatabasePrincipals
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DBPrincipalInfo"
        "400":
          description: The connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
    post:
      summary: Create a database-level user/login/role
      description: Live RPC. can_login/superuser map to each engine's closest native concept — see docs/API.md "User/role/permission management".
      tags: [Databases]
      operationId: createDatabasePrincipal
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                password:
                  type: string
                can_login:
                  type: boolean
                superuser:
                  type: boolean
      responses:
        "201":
          description: Created
        "400":
          description: name/password missing, or the connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/databases/{connectionID}/principals/{principal}:
    delete:
      summary: Drop a database-level user/login/role
      description: Live RPC.
      tags: [Databases]
      operationId: deleteDatabasePrincipal
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: principal
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: The connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
    patch:
      summary: Set a database-level user/login/role's password
      description: Live RPC.
      tags: [Databases]
      operationId: setDatabasePrincipalPassword
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: principal
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: password missing, or the connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/databases/{connectionID}/principals/{principal}/grants:
    get:
      summary: List a principal's granted privileges
      description: Live RPC. Table-level grants only. raw is set instead of the structured fields for an engine (MySQL) that only exposes its own native grant statement text — see docs/DECISIONS.md ADR-024.
      tags: [Databases]
      operationId: listDatabaseGrants
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: principal
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DBGrantInfo"
        "400":
          description: The connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
    post:
      summary: Grant a privilege on one table to a principal
      description: Live RPC. privilege is validated against a fixed whitelist (SELECT, INSERT, UPDATE, DELETE, ALL) by both the Control Server and the runtime — it can't be a bound parameter in GRANT syntax (docs/DECISIONS.md ADR-024).
      tags: [Databases]
      operationId: grantDatabasePrivilege
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: principal
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privilege, table]
              properties:
                privilege:
                  type: string
                  enum: [SELECT, INSERT, UPDATE, DELETE, ALL]
                schema:
                  type: string
                table:
                  type: string
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: privilege/table missing or invalid, or the connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/databases/{connectionID}/principals/{principal}/grants/revoke:
    post:
      summary: Revoke a privilege on one table from a principal
      description: Live RPC. Same request shape and privilege whitelist as POST .../grants, reversed.
      tags: [Databases]
      operationId: revokeDatabasePrivilege
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: principal
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privilege, table]
              properties:
                privilege:
                  type: string
                  enum: [SELECT, INSERT, UPDATE, DELETE, ALL]
                schema:
                  type: string
                table:
                  type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: privilege/table missing or invalid, or the connection's engine has no server-side users/roles (sqlite)
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/audit:
    get:
      summary: List recorded audit events
      description: Administrator-only system-wide security log (docs/SECURITY.md "Audit"). Most recent first.
      tags: [Audit]
      operationId: listAuditEvents
      security:
        - cookieAuth: []
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339, inclusive.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: RFC3339, inclusive.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Default 100, capped at 500.
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching events, and the total count ignoring limit/offset
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  total:
                    type: integer
        "400":
          description: since/until not RFC3339
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
  /api/v1/audit/settings:
    get:
      summary: Get the audit retention policy
      tags: [Audit]
      operationId: getAuditSettings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current retention policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSettings"
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
    put:
      summary: Update the audit retention policy
      tags: [Audit]
      operationId: updateAuditSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retention_days]
              properties:
                retention_days:
                  type: integer
                  description: "<= 0 means keep events forever."
      responses:
        "200":
          description: Updated retention policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSettings"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: devstationone_session
  schemas:
    AdminUser:
      type: object
      required: [id, email, display_name, role, created_at, last_accessed_at]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        last_accessed_at:
          type:
            - string
            - "null"
          format: date-time
          description: The account's last authenticated request (max sessions.last_seen_at); null until the user signs in.
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: At least 8 characters.
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
          default: user
    UserPatch:
      type: object
      description: Only the fields present in the request change; a blank (absent) password keeps the existing one.
      properties:
        display_name:
          type: string
        password:
          type: string
          description: At least 8 characters; resets the account's password.
        role:
          type: string
          enum: [user, admin]
    UserResources:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        runtimes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
    UserReassign:
      type: object
      required: [target_user_id]
      properties:
        target_user_id:
          type: string
        project_ids:
          type: array
          items:
            type: string
          description: Absent = leave projects alone; empty array = all; non-empty = those IDs.
        runtime_ids:
          type: array
          items:
            type: string
          description: Absent = leave runtimes alone; empty array = all; non-empty = those IDs.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: [string, "null"]
    User:
      type: object
      required: [id, email, display_name, is_admin, terminal_font, theme, editor_font, font_size, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
          description: Optional friendly name shown instead of the email ("" falls back to the email).
        is_admin:
          type: boolean
        terminal_font:
          type: string
          enum: [system, jetbrainsmono-nerd, fira-code, cascadia-code, source-code-pro]
        editor_font:
          type: string
          enum: [system, fira-code, cascadia-code, source-code-pro]
        font_size:
          type: integer
          minimum: 12
          maximum: 18
        theme:
          type: string
          enum: [dark, light]
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, user_agent, ip_address, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    RuntimeCapabilities:
      type: object
      properties:
        terminal:
          type: boolean
        filesystem:
          type: boolean
        services:
          type: boolean
        databases:
          type: array
          items:
            type: string
        os_username:
          type: string
          description: OS user the runtime process runs as. A runtime always runs as one fixed user (ADR-014), reported live instead of typed into a Project.
        home_dir:
          type: string
          description: Home directory of os_username. Root for the Project setup directory picker (GET/POST .../runtimes/{runtimeID}/browse*) and for working_directory containment.
        shells:
          type: array
          items:
            type: string
          description: Login shells parsed from /etc/shells on the runtime host. Empty if unreadable — no fallback list is offered.
        users:
          type: array
          items:
            type: string
          description: Account names parsed from /etc/passwd on the runtime host, unfiltered (system accounts included). Backs the file properties owner dropdown.
        groups:
          type: array
          items:
            type: string
          description: Group names parsed from /etc/group on the runtime host, unfiltered. Backs the file properties group dropdown.
    Runtime:
      type: object
      required: [id, name, hostname, os, arch, runtime_version, capabilities, status, online, enrolled_at, last_seen_at, revoked_at, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        runtime_version:
          type: string
        capabilities:
          $ref: "#/components/schemas/RuntimeCapabilities"
        status:
          type: string
          enum: [pending, online, offline, revoked]
        online:
          type: boolean
          description: Whether the runtime currently has a live connection.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    RuntimeWithToken:
      allOf:
        - $ref: "#/components/schemas/Runtime"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw enrollment token, shown exactly once.
    ProjectFields:
      type: object
      required: [name, runtime_id, working_directory, shell]
      properties:
        name:
          type: string
        runtime_id:
          type: string
        working_directory:
          type: string
          description: >
            Absolute path used as the authoritative session working directory.
            Must resolve inside the target runtime's capabilities.home_dir;
            the server re-validates this against the runtime's real
            filesystem (a "stat" file.command RPC), not just string
            containment. The runtime's OS user identity is not part of this
            resource — see RuntimeCapabilities.os_username.
        shell:
          type: string
          description: Absolute path to the shell binary used for interactive sessions. Must be one of the target runtime's currently-reported capabilities.shells.
        description:
          type: string
          description: Optional human-readable summary of the project, shown in the projects list and searched by its filter box.
        environment:
          type: object
          additionalProperties:
            type: string
          description: Environment variables applied to the Project's sessions.
    ProjectPatch:
      type: object
      description: Same properties as ProjectFields; only the fields present in the request are changed. Validation (runtime online, shell allowlist, working_directory containment) re-runs on every patch, even one that only renames the project.
      properties:
        name:
          type: string
        description:
          type: string
        runtime_id:
          type: string
        working_directory:
          type: string
        shell:
          type: string
        environment:
          type: object
          additionalProperties:
            type: string
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectFields"
        - type: object
          required: [id, created_by, created_at, updated_at, active_sessions]
          properties:
            id:
              type: string
            created_by:
              type: string
              description: ID of the user who owns this project.
            owner_name:
              type: string
              description: The owner's display name (email fallback), for the projects list Owner column.
            last_accessed_at:
              type:
                - string
                - "null"
              format: date-time
              description: When a terminal session was last opened on this project; null for projects never opened since the field existed.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            active_sessions:
              type: integer
              description: >
                Count of this project's terminal sessions not in a terminal
                status (exited/failed/closed) — see docs/API.md "Dashboard
                events".
    TerminalSessionFields:
      type: object
      required: [name]
      properties:
        name:
          type: string
        cols:
          type: integer
          default: 80
        rows:
          type: integer
          default: 24
        render_mode:
          type: string
          enum: [xterm, cards]
          default: xterm
          description: |
            Client rendering mode (Slice 17). Immutable after creation —
            switch modes by opening a new session.
    EditorState:
      type: object
      description: Opaque per-user+project editor tab state (open tabs, active tab, cursor offsets). The server stores it verbatim; the browser owns the shape.
      additionalProperties: true
    TerminalSession:
      type: object
      description: |
        A persistent PTY session running on its project's runtime. Named
        "TerminalSession" (not "Session") to avoid confusion with the
        unrelated browser-auth Session schema above (see ADR-015).
      required: [id, project_id, name, status, cols, rows, exit_code, created_by, created_at, updated_at, render_mode]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [requested, starting, running, detached, exited, failed, closed]
        cols:
          type: integer
        rows:
          type: integer
        exit_code:
          type: [integer, "null"]
        error:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        render_mode:
          type: string
          enum: [xterm, cards]
    ServiceInfo:
      type: object
      description: A systemd --user unit's live status. Not a stored resource — see docs/API.md "Services".
      required: [unit, description, load_state, active_state, sub_state, enabled]
      properties:
        unit:
          type: string
        description:
          type: string
        load_state:
          type: string
        active_state:
          type: string
        sub_state:
          type: string
        enabled:
          type: string
          enum: [enabled, disabled, static, unknown]
    DatabaseConnection:
      type: object
      description: A stored database connection, scoped to a Project. Credentials are never included — see has_secret and docs/API.md "Databases".
      required: [id, project_id, name, engine, host, port, username, database, ssl_mode, instance_name, search_path, has_secret, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mssql, sqlite]
        host:
          type: string
          description: Ignored for sqlite.
        port:
          type: integer
        username:
          type: string
          description: Ignored for sqlite.
        database:
          type: string
          description: Database/catalog name, or a runtime-local file path for sqlite.
        ssl_mode:
          type: string
          description: Ignored for sqlite.
        instance_name:
          type: string
          description: Optional MSSQL named instance.
        search_path:
          type: string
          description: Optional Postgres default schema.
        has_secret:
          type: boolean
          description: Whether a password/extra-params secret is stored. Never the secret itself.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseConnectionRequest:
      type: object
      required: [name, engine]
      properties:
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mssql, sqlite]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Create only. Write-only — never echoed back.
        database:
          type: string
        ssl_mode:
          type: string
        instance_name:
          type: string
        search_path:
          type: string
        extra_params:
          type: string
          description: Free-form "key=value&key2=value2", passed through to the engine's connection string.
    DBTableInfo:
      type: object
      description: One table or view. Not a stored resource — live RPC result, see docs/API.md "Databases".
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [table, view]
    DBColumnInfo:
      type: object
      description: One table/view column. Not a stored resource.
      required: [name, type, nullable, position]
      properties:
        name:
          type: string
        type:
          type: string
          description: The engine's own native type name, not normalized across engines.
        nullable:
          type: boolean
        default:
          type: string
        position:
          type: integer
    DBIndexInfo:
      type: object
      description: One table index. Not a stored resource.
      required: [name, columns, unique, primary]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        unique:
          type: boolean
        primary:
          type: boolean
    DBConstraintInfo:
      type: object
      description: One table constraint. Not a stored resource.
      required: [name, type, columns]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [primary_key, foreign_key, unique, check]
        columns:
          type: array
          items:
            type: string
        references:
          type: string
          description: "\"schema.table(column)\" for a foreign_key constraint, omitted otherwise."
    DBTriggerInfo:
      type: object
      description: One table trigger. Not a stored resource. event/timing are best-effort, omitted where the engine doesn't expose them structurally (SQLite).
      required: [name]
      properties:
        name:
          type: string
        event:
          type: string
        timing:
          type: string
    DBRowsResult:
      type: object
      description: The result of a rows or query request. Exactly one of (columns+rows) or (is_exec+rows_affected) is meaningful, matching whether the statement produced a result set. Not a stored resource.
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          description: Each row is an array of values in columns order (numbers/strings/bools/null/timestamps; genuinely binary data is base64-encoded).
          items:
            type: array
            items: {}
        has_more:
          type: boolean
        is_exec:
          type: boolean
          description: True for a statement with no result set (query only — rows always produces a result set).
        rows_affected:
          type: integer
    DBRowEdit:
      type: object
      description: One staged insert/update/delete for a commit request.
      required: [op]
      properties:
        op:
          type: string
          enum: [insert, update, delete]
        original:
          type: object
          description: The row's column values as last fetched by rows — used to build the WHERE clause locating it. Unused for insert.
          additionalProperties: {}
        values:
          type: object
          description: New column values for insert/update. Unused for delete.
          additionalProperties: {}
    DBPrincipalInfo:
      type: object
      description: One database-level user, login, or role. Not a stored resource — live RPC result, see docs/API.md "User/role/permission management".
      required: [name, can_login, superuser]
      properties:
        name:
          type: string
          description: "For MySQL/MariaDB: \"user@host\"."
        can_login:
          type: boolean
        superuser:
          type: boolean
    DBGrantInfo:
      type: object
      description: One granted privilege. Not a stored resource. raw is set instead of the structured fields for an engine (MySQL) that only exposes its own native grant statement text.
      properties:
        privilege:
          type: string
        schema:
          type: string
        table:
          type: string
        raw:
          type: string
    FileInfo:
      type: object
      description: One filesystem entry inside the Project's working directory. Not a stored resource — see docs/API.md "Files".
      required: [name, type, size, mode, mtime, owner_id, group_id]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, dir, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: POSIX mode string, e.g. "-rw-r--r--"
        mtime:
          type: string
          format: date-time
        owner:
          type: string
          description: Resolved username for owner_id. Omitted if the uid has no matching /etc/passwd entry.
        owner_id:
          type: integer
          description: Numeric uid.
        group:
          type: string
          description: Resolved group name for group_id. Omitted if the gid has no matching /etc/group entry.
        group_id:
          type: integer
          description: Numeric gid.
    GitFileStatus:
      type: object
      description: One changed path from a git status call. Not a stored resource — see docs/API.md "Git".
      required: [path, index, worktree]
      properties:
        path:
          type: string
        orig_path:
          type: string
          description: Set only for a rename/copy, to the path before the change.
        index:
          type: string
          description: The staged-change status code (".", "M", "A", "D", "R", "C", "U", or "?" for untracked).
        worktree:
          type: string
          description: The unstaged-change status code, same vocabulary as index.
    AuditEvent:
      type: object
      description: One recorded audit event (docs/API.md "Audit"). actor_user_id is null for an event with no authenticated actor (e.g. a failed login) or once the referenced user is later deleted; actor_email is captured at event time and stays even then.
      required: [id, occurred_at, event_type, actor_email, resource_type, resource_id, detail, ip_address]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
        actor_user_id:
          type: [string, "null"]
        actor_email:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        detail:
          type: object
        ip_address:
          type: string
    AuditSettings:
      type: object
      required: [retention_days, updated_at]
      properties:
        retention_days:
          type: integer
          description: "<= 0 means keep events forever."
        updated_at:
          type: string
          format: date-time
    GitCommitInfo:
      type: object
      description: One recent commit from a git log call. Not a stored resource.
      required: [sha, subject, author, datetime]
      properties:
        sha:
          type: string
        subject:
          type: string
        author:
          type: string
        datetime:
          type: string
          format: date-time
    JournalNoteInput:
      type: object
      description: Create/update input for a journal note. body_html is Summernote-produced HTML, sanitized at render time (DOMPurify) and never rendered unsanitized; commit metadata is captured free text, not a live reference.
      required: [body_html]
      properties:
        body_html:
          type: string
        commit_sha:
          type: string
        commit_subject:
          type: string
        commit_author:
          type: string
        commit_datetime:
          type: [string, "null"]
          format: date-time
    JournalAttachment:
      type: object
      required: [id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
    JournalNoteBase:
      type: object
      required: [id, project_id, commit_sha, commit_subject, commit_author, created_by, creator_name, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        commit_sha:
          type: string
          description: Captured SHA at link time ("" when unassociated).
        commit_subject:
          type: string
        commit_author:
          type: string
        commit_datetime:
          type: [string, "null"]
          format: date-time
        created_by:
          type: string
        creator_name:
          type: string
          description: The creator's display_name, falling back to their email.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JournalNoteSummary:
      type: object
      description: One journal note as returned by the list — snippet only, never the full body.
      allOf:
        - $ref: "#/components/schemas/JournalNoteBase"
        - type: object
          required: [snippet]
          properties:
            snippet:
              type: string
    JournalNote:
      type: object
      description: One journal note with its full body and attachments.
      allOf:
        - $ref: "#/components/schemas/JournalNoteBase"
        - type: object
          required: [body_html]
          properties:
            body_html:
              type: string
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/JournalAttachment"
