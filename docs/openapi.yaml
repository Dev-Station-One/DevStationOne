openapi: 3.1.0
info:
  title: DevStationOne API
  version: 0.1.0
  description: |
    OpenAPI contract for the DevStationOne self-hosted remote development platform.
    This file is intentionally minimal at repository creation. Each implementation
    slice must expand it with the real contract before that slice is marked complete.
servers:
  - url: /
security: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Runtimes
  - name: Projects
  - name: Sessions
  - name: Files
  - name: Databases
  - name: Services
  - name: Audit
paths:
  /healthz:
    get:
      summary: Liveness check
      tags: [Health]
      operationId: health
      responses:
        "200":
          description: Healthy
  /readyz:
    get:
      summary: Readiness check
      tags: [Health]
      operationId: readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
        "401":
          description: Invalid email or password
  /api/v1/auth/logout:
    post:
      summary: Log out and destroy the current session
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Logged out
  /api/v1/auth/session:
    get:
      summary: Get the current authenticated user
      tags: [Auth]
      operationId: getCurrentSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /api/v1/auth/preferences:
    put:
      summary: Update the current user's preferences
      description: Only the terminal font preference exists (docs/REQUIREMENTS_NERD_FONT.md). Read it via GET /api/v1/auth/session.
      tags: [Auth]
      operationId: updatePreferences
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update — fields left out are untouched; at least one must be present.
              properties:
                terminal_font:
                  type: string
                  enum: [system, jetbrainsmono-nerd]
                theme:
                  type: string
                  enum: [dark, light]
      responses:
        "204":
          description: Saved
        "400":
          description: Unknown value, or no field named
        "401":
          description: Not authenticated
  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags: [Auth]
      operationId: listSessions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
  /api/v1/auth/sessions/{sessionID}:
    delete:
      summary: Revoke one of the current user's sessions
      tags: [Auth]
      operationId: revokeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked
        "401":
          description: Not authenticated
        "404":
          description: Session not found
  /api/v1/runtimes:
    get:
      summary: List registered runtimes
      description: Open to any authenticated user, so a Project can be created with a runtime selected from this list.
      tags: [Runtimes]
      operationId: listRuntimes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Registered runtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Runtime"
        "401":
          description: Not authenticated
    post:
      summary: Register a new runtime and issue its enrollment token
      tags: [Runtimes]
      operationId: createRuntime
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Runtime registered; token shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWithToken"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
  /api/v1/runtimes/{runtimeID}/revoke:
    post:
      summary: Revoke a runtime, preventing further connections
      tags: [Runtimes]
      operationId: revokeRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Runtime revoked
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Runtime not found
  /api/v1/runtimes/{runtimeID}/browse:
    get:
      summary: List a directory under a runtime's home directory
      description: >
        For the Project setup UI's directory picker, used before a Project
        exists. Every call is a live RPC to the runtime (the same
        file.command the Files endpoints use), rooted at the runtime's
        reported home directory instead of a Project's working directory.
        Open to any authenticated user, matching GET /runtimes' visibility —
        runtimes are shared infrastructure, not owned per-user. See
        docs/PROTOCOL.md.
      tags: [Runtimes]
      operationId: browseRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Directory to list, relative to the runtime's home directory. "." lists the home directory itself.
          schema:
            type: string
      responses:
        "200":
          description: The directory's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileInfo"
        "400":
          description: Invalid path (empty, absolute, or escaping the home directory)
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not read the directory
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/runtimes/{runtimeID}/browse/search:
    get:
      summary: Search directory names under a runtime's home directory
      description: >
        Case-insensitive name-substring search over the subtree rooted at
        path, restricted to directories. For the Project setup UI's tree
        search box. Bounded by the same depth/match caps as
        /files/search. See docs/PROTOCOL.md.
      tags: [Runtimes]
      operationId: browseRuntimeSearch
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Subtree to search, relative to the runtime's home directory. "." searches the whole home directory.
          schema:
            type: string
      responses:
        "200":
          description: Root-relative paths of matching directories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid path (empty, absolute, or escaping the home directory), or empty q
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not search the directory
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/runtimes/{runtimeID}/browse/mkdir:
    post:
      summary: Create a directory under a runtime's home directory
      description: For the directory picker's "new folder" action. Fails if the directory already exists.
      tags: [Runtimes]
      operationId: browseRuntimeMkdir
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Directory to create, relative to the runtime's home directory.
      responses:
        "204":
          description: Created
        "400":
          description: Invalid or missing path
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not create the directory (e.g. it already exists)
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects:
    get:
      summary: List projects visible to the current user
      description: Administrators see every project; other users see only projects they created.
      tags: [Projects]
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
    post:
      summary: Create a project
      tags: [Projects]
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFields"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body; the referenced runtime does not exist or is revoked; shell is not in the runtime's reported shells; or working_directory is not contained in (or does not exist under) the runtime's home_dir
        "401":
          description: Not authenticated
        "409":
          description: The referenced runtime is offline, or has not reported a home directory yet
  /api/v1/projects/{projectID}:
    get:
      summary: Get a project
      tags: [Projects]
      operationId: getProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    patch:
      summary: Update a project
      tags: [Projects]
      operationId: updateProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body; the referenced runtime does not exist or is revoked; shell is not in the runtime's reported shells; or working_directory is not contained in (or does not exist under) the runtime's home_dir
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime (whether or not runtime_id changed in this request) is offline, or has not reported a home directory yet — re-checked on every patch, not only when runtime-derived fields change
    delete:
      summary: Delete a project
      tags: [Projects]
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
  /api/v1/projects/{projectID}/sessions:
    get:
      summary: List a project's terminal sessions
      tags: [Sessions]
      operationId: listProjectSessions
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    post:
      summary: Create a terminal session (starts a real PTY on the project's runtime)
      description: |
        Synchronously sends session.open to the project's runtime and waits
        up to 10s for it to start. See docs/API.md "Sessions" for the
        status lifecycle and error responses.
      tags: [Sessions]
      operationId: createSession
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSessionFields"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime rejected session.open, or it could not be dispatched
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/sessions/{sessionID}:
    get:
      summary: Get a terminal session
      tags: [Sessions]
      operationId: getSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
    patch:
      summary: Rename a terminal session
      tags: [Sessions]
      operationId: renameSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Session renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
    delete:
      summary: Close a terminal session
      description: Sends session.close to the runtime (best-effort) and marks the session closed, a terminal status.
      tags: [Sessions]
      operationId: closeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session closed
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
  /api/v1/sessions/{sessionID}/attach:
    post:
      summary: Confirm a session can be attached to
      description: Does not itself stream bytes — opening the WSS stream is what attaches a browser. This just validates the session is still live before a client opens it.
      tags: [Sessions]
      operationId: attachSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session is live and can be attached to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: Session is exited, failed, or closed
  /api/v1/sessions/{sessionID}/detach:
    post:
      summary: Force-disconnect whichever browser is currently attached
      description: The session (and its process) is unaffected; a future attach still sees buffered scrollback.
      tags: [Sessions]
      operationId: detachSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Detached
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
  /api/v1/sessions/{sessionID}/resize:
    post:
      summary: Resize a session's PTY
      tags: [Sessions]
      operationId: resizeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                rows:
                  type: integer
      responses:
        "204":
          description: Resized
        "400":
          description: cols/rows must be positive integers
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: Failed to reach the runtime
  /api/v1/sessions/{sessionID}/signal:
    post:
      summary: Send a POSIX signal to a session's process
      description: For explicit process control (e.g. a "Force stop" action). Normal input, including Ctrl+C/Ctrl+D as bytes, goes through the WSS stream instead.
      tags: [Sessions]
      operationId: signalSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [SIGINT, SIGTERM, SIGKILL, SIGHUP, SIGQUIT, SIGTSTP, SIGCONT]
      responses:
        "204":
          description: Signal sent
        "400":
          description: Unsupported signal
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: Failed to reach the runtime
  /api/v1/projects/{projectID}/services:
    get:
      summary: List systemd --user services on the project's runtime
      description: Not a stored resource — every call is a live RPC to the runtime. See docs/API.md "Services".
      tags: [Services]
      operationId: listServices
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every unit the runtime's systemd --user instance knows about
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceInfo"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime failed to run systemctl
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}:
    get:
      summary: Get one service's current status
      tags: [Services]
      operationId: getService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime reported the unit not found, or systemctl failed
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/logs:
    get:
      summary: Get a service's recent journal lines
      tags: [Services]
      operationId: getServiceLogs
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          description: Defaults to 200, capped at 2000.
          schema:
            type: integer
      responses:
        "200":
          description: Recent journal lines, oldest first. Empty is a normal result, not an error.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid unit name, or lines is not a positive integer
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: journalctl failed on the runtime
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/start:
    post:
      summary: Start a service
      tags: [Services]
      operationId: startService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: systemctl failed on the runtime
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/stop:
    post:
      summary: Stop a service
      tags: [Services]
      operationId: stopService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: systemctl failed on the runtime
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/restart:
    post:
      summary: Restart a service
      tags: [Services]
      operationId: restartService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: systemctl failed on the runtime
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/enable:
    post:
      summary: Enable a service to start at login
      tags: [Services]
      operationId: enableService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: systemctl failed on the runtime (e.g. the unit has no [Install] section)
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/services/{unit}/disable:
    post:
      summary: Disable a service
      tags: [Services]
      operationId: disableService
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: unit
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The unit's resulting status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "400":
          description: Invalid unit name
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: systemctl failed on the runtime
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files:
    get:
      summary: List a directory's entries
      description: Every call is a live RPC to the runtime; the path is resolved inside the Project's working directory. See docs/API.md "Files".
      tags: [Files]
      operationId: listFiles
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Directory to list, relative to the Project's working directory. "." lists the root.
          schema:
            type: string
      responses:
        "200":
          description: The directory's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileInfo"
        "400":
          description: Invalid path (empty, absolute, or escaping the project root)
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not read the directory
        "504":
          description: The runtime did not respond within the timeout
    delete:
      summary: Delete a file or directory tree
      description: Directories are removed recursively. The project root itself cannot be deleted.
      tags: [Files]
      operationId: deleteFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Entry to delete, relative to the Project's working directory.
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid path (empty, absolute, or escaping the project root)
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not delete the entry
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/search:
    get:
      summary: Search entry names by substring
      description: Case-insensitive name-substring search over the subtree rooted at path. Bounded by depth/match caps on the runtime.
      tags: [Files]
      operationId: searchFiles
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Subtree to search, relative to the Project's working directory.
          schema:
            type: string
      responses:
        "200":
          description: Root-relative paths of matching entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid path or empty q
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The search exceeded its entry limit
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/stat:
    get:
      summary: Stat one entry
      tags: [Files]
      operationId: statFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The entry's metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        "400":
          description: Invalid path
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not stat the entry
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/content:
    get:
      summary: Read a file's bytes
      description: Returns the raw file with a Content-Type derived from the extension. `download=1` forces a Content-Disposition attachment; HTML/SVG always get an attachment disposition. Files larger than the 24 MB transfer limit are rejected.
      tags: [Files]
      operationId: readFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The file's bytes
          content:
            application/octet-stream: {}
        "400":
          description: Invalid path, or the path names a directory
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not read the file, or it exceeds the transfer limit
        "504":
          description: The runtime did not respond within the timeout
    put:
      summary: Write or upload a file
      description: The raw request body is the file's bytes. Creates the file (0644) when absent, replaces it when present. Limited to 24 MB.
      tags: [Files]
      operationId: writeFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Written
        "400":
          description: Invalid path
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "413":
          description: Body exceeds the 24 MB upload limit
        "502":
          description: The runtime could not write the file
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/create:
    post:
      summary: Create an empty file
      description: Fails if the file already exists.
      tags: [Files]
      operationId: createFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "204":
          description: Created
        "400":
          description: Invalid or missing path
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not create the file (e.g. it already exists)
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/mkdir:
    post:
      summary: Create a directory
      description: Fails if the directory already exists.
      tags: [Files]
      operationId: mkdir
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "204":
          description: Created
        "400":
          description: Invalid or missing path
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not create the directory
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/rename:
    post:
      summary: Rename an entry
      description: Replaces the destination if it exists (POSIX semantics).
      tags: [Files]
      operationId: renameFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                to:
                  type: string
      responses:
        "204":
          description: Renamed
        "400":
          description: Invalid or missing from/to
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not rename the entry
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/copy:
    post:
      summary: Copy a file or directory tree
      description: Fails if the destination exists.
      tags: [Files]
      operationId: copyFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                to:
                  type: string
      responses:
        "204":
          description: Copied
        "400":
          description: Invalid or missing from/to
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not copy the entry
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/move:
    post:
      summary: Move an entry
      description: Same-filesystem rename; replaces the destination if it exists.
      tags: [Files]
      operationId: moveFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                to:
                  type: string
      responses:
        "204":
          description: Moved
        "400":
          description: Invalid or missing from/to
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not move the entry
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/databases:
    post:
      summary: Create a database connection
      tags: [Databases]
      operationId: createDatabaseConnection
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseConnectionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          description: Missing/invalid fields
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    get:
      summary: List a project's database connections
      tags: [Databases]
      operationId: listDatabaseConnections
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every connection on the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseConnection"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
  /api/v1/projects/{projectID}/databases/{connectionID}:
    get:
      summary: Get one database connection
      tags: [Databases]
      operationId: getDatabaseConnection
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found, or not owned by the current user
    patch:
      summary: Update a database connection
      description: Only replaces the stored secret when the request body includes a "secret" object; omitting it leaves the existing password/extra_params untouched.
      tags: [Databases]
      operationId: patchDatabaseConnection
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                engine:
                  type: string
                  enum: [postgresql, mysql, mssql, sqlite]
                host:
                  type: string
                port:
                  type: integer
                username:
                  type: string
                database:
                  type: string
                ssl_mode:
                  type: string
                instance_name:
                  type: string
                search_path:
                  type: string
                secret:
                  type: object
                  description: Present only when replacing the stored password/extra_params.
                  properties:
                    password:
                      type: string
                    extra_params:
                      type: string
      responses:
        "200":
          description: The updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          description: Missing/invalid fields
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found, or not owned by the current user
    delete:
      summary: Delete a database connection
      tags: [Databases]
      operationId: deleteDatabaseConnection
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found, or not owned by the current user
  /api/v1/projects/{projectID}/databases/{connectionID}/test:
    post:
      summary: Test a database connection
      description: A live RPC to the project's runtime, which opens and pings the connection, then closes it. A failed connection is a normal 200 {"ok":false} result, not a server error.
      tags: [Databases]
      operationId: testDatabaseConnection
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Not authenticated
        "404":
          description: Project or connection not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "504":
          description: The runtime did not respond within the timeout
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: devstationone_session
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: [string, "null"]
    User:
      type: object
      required: [id, email, is_admin, terminal_font, theme, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
        terminal_font:
          type: string
          enum: [system, jetbrainsmono-nerd]
        theme:
          type: string
          enum: [dark, light]
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, user_agent, ip_address, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    RuntimeCapabilities:
      type: object
      properties:
        terminal:
          type: boolean
        filesystem:
          type: boolean
        services:
          type: boolean
        databases:
          type: array
          items:
            type: string
        os_username:
          type: string
          description: OS user the runtime process runs as. A runtime always runs as one fixed user (ADR-014), reported live instead of typed into a Project.
        home_dir:
          type: string
          description: Home directory of os_username. Root for the Project setup directory picker (GET/POST .../runtimes/{runtimeID}/browse*) and for working_directory containment.
        shells:
          type: array
          items:
            type: string
          description: Login shells parsed from /etc/shells on the runtime host. Empty if unreadable — no fallback list is offered.
    Runtime:
      type: object
      required: [id, name, hostname, os, arch, runtime_version, capabilities, status, online, enrolled_at, last_seen_at, revoked_at, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        runtime_version:
          type: string
        capabilities:
          $ref: "#/components/schemas/RuntimeCapabilities"
        status:
          type: string
          enum: [pending, online, offline, revoked]
        online:
          type: boolean
          description: Whether the runtime currently has a live connection.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    RuntimeWithToken:
      allOf:
        - $ref: "#/components/schemas/Runtime"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw enrollment token, shown exactly once.
    ProjectFields:
      type: object
      required: [name, runtime_id, working_directory, shell]
      properties:
        name:
          type: string
        runtime_id:
          type: string
        working_directory:
          type: string
          description: >
            Absolute path used as the authoritative session working directory.
            Must resolve inside the target runtime's capabilities.home_dir;
            the server re-validates this against the runtime's real
            filesystem (a "stat" file.command RPC), not just string
            containment. The runtime's OS user identity is not part of this
            resource — see RuntimeCapabilities.os_username.
        shell:
          type: string
          description: Absolute path to the shell binary used for interactive sessions. Must be one of the target runtime's currently-reported capabilities.shells.
        environment:
          type: object
          additionalProperties:
            type: string
          description: Environment variables applied to the Project's sessions.
    ProjectPatch:
      type: object
      description: Same properties as ProjectFields; only the fields present in the request are changed. Validation (runtime online, shell allowlist, working_directory containment) re-runs on every patch, even one that only renames the project.
      properties:
        name:
          type: string
        runtime_id:
          type: string
        working_directory:
          type: string
        shell:
          type: string
        environment:
          type: object
          additionalProperties:
            type: string
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectFields"
        - type: object
          required: [id, created_by, created_at, updated_at]
          properties:
            id:
              type: string
            created_by:
              type: string
              description: ID of the user who owns this project.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    TerminalSessionFields:
      type: object
      required: [name]
      properties:
        name:
          type: string
        cols:
          type: integer
          default: 80
        rows:
          type: integer
          default: 24
    TerminalSession:
      type: object
      description: |
        A persistent PTY session running on its project's runtime. Named
        "TerminalSession" (not "Session") to avoid confusion with the
        unrelated browser-auth Session schema above (see ADR-015).
      required: [id, project_id, name, status, cols, rows, exit_code, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [requested, starting, running, detached, exited, failed, closed]
        cols:
          type: integer
        rows:
          type: integer
        exit_code:
          type: [integer, "null"]
        error:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceInfo:
      type: object
      description: A systemd --user unit's live status. Not a stored resource — see docs/API.md "Services".
      required: [unit, description, load_state, active_state, sub_state, enabled]
      properties:
        unit:
          type: string
        description:
          type: string
        load_state:
          type: string
        active_state:
          type: string
        sub_state:
          type: string
        enabled:
          type: string
          enum: [enabled, disabled, static, unknown]
    DatabaseConnection:
      type: object
      description: A stored database connection, scoped to a Project. Credentials are never included — see has_secret and docs/API.md "Databases".
      required: [id, project_id, name, engine, host, port, username, database, ssl_mode, instance_name, search_path, has_secret, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mssql, sqlite]
        host:
          type: string
          description: Ignored for sqlite.
        port:
          type: integer
        username:
          type: string
          description: Ignored for sqlite.
        database:
          type: string
          description: Database/catalog name, or a runtime-local file path for sqlite.
        ssl_mode:
          type: string
          description: Ignored for sqlite.
        instance_name:
          type: string
          description: Optional MSSQL named instance.
        search_path:
          type: string
          description: Optional Postgres default schema.
        has_secret:
          type: boolean
          description: Whether a password/extra-params secret is stored. Never the secret itself.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseConnectionRequest:
      type: object
      required: [name, engine]
      properties:
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mssql, sqlite]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Create only. Write-only — never echoed back.
        database:
          type: string
        ssl_mode:
          type: string
        instance_name:
          type: string
        search_path:
          type: string
        extra_params:
          type: string
          description: Free-form "key=value&key2=value2", passed through to the engine's connection string.
    FileInfo:
      type: object
      description: One filesystem entry inside the Project's working directory. Not a stored resource — see docs/API.md "Files".
      required: [name, type, size, mode, mtime]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, dir, symlink, other]
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: POSIX mode string, e.g. "-rw-r--r--"
        mtime:
          type: string
          format: date-time
