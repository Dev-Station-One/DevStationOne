openapi: 3.1.0
info:
  title: DevStationOne API
  version: 0.1.0
  description: |
    OpenAPI contract for the DevStationOne self-hosted remote development platform.
    This file is intentionally minimal at repository creation. Each implementation
    slice must expand it with the real contract before that slice is marked complete.
servers:
  - url: /
security: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Runtimes
  - name: Projects
  - name: Sessions
  - name: Files
  - name: Git
  - name: Databases
  - name: Services
  - name: Audit
  - name: Metrics
paths:
  /healthz:
    get:
      summary: Liveness check
      tags: [Health]
      operationId: health
      responses:
        "200":
          description: Healthy
  /readyz:
    get:
      summary: Readiness check
      tags: [Health]
      operationId: readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/metrics:
    get:
      summary: Basic operational counters
      description: Go expvar JSON format (docs/API.md "Metrics", docs/DECISIONS.md ADR-026) — not a Prometheus exposition endpoint.
      tags: [Metrics]
      operationId: getMetrics
      security:
        - cookieAuth: []
      responses:
        "200":
          description: expvar-format JSON
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
        "401":
          description: Invalid email or password
  /api/v1/auth/logout:
    post:
      summary: Log out and destroy the current session
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Logged out
  /api/v1/auth/session:
    get:
      summary: Get the current authenticated user
      tags: [Auth]
      operationId: getCurrentSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /api/v1/auth/preferences:
    put:
      summary: Update the current user's preferences
      description: Only the terminal font preference exists (docs/REQUIREMENTS_NERD_FONT.md). Read it via GET /api/v1/auth/session.
      tags: [Auth]
      operationId: updatePreferences
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update — fields left out are untouched; at least one must be present.
              properties:
                terminal_font:
                  type: string
                  enum: [system, jetbrainsmono-nerd, fira-code, cascadia-code, source-code-pro]
                editor_font:
                  type: string
                  enum: [system, fira-code, cascadia-code, source-code-pro]
                font_size:
                  type: integer
                  minimum: 12
                  maximum: 18
                theme:
                  type: string
                  enum: [dark, light]
                display_name:
                  type: string
                  maxLength: 80
                  description: Trimmed on save; empty clears it (the email is shown instead).
      responses:
        "204":
          description: Saved
        "400":
          description: Unknown value, or no field named
        "401":
          description: Not authenticated
  /api/v1/users:
    get:
      summary: List user accounts (administrator only)
      description: Every account, with its last-activity timestamp derived live from the user's auth sessions.
      tags: [Users]
      operationId: listUsers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
    post:
      summary: Create a user account (administrator only)
      tags: [Users]
      operationId: createUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request body; email or password missing/short; or an invalid role
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "409":
          description: The email is already registered
  /api/v1/users/{userID}:
    patch:
      summary: Update a user account (administrator only; last-admin and self-demotion guards apply)
      tags: [Users]
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request body; short password; invalid role; or a guard rail fired (demoting yourself, or demoting/deleting the last administrator)
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: User not found
    delete:
      summary: Delete a user account (administrator only; self/last-admin/ownership guards apply)
      tags: [Users]
      operationId: deleteUser
      security:
        - cookieAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted (their auth sessions are removed with the account)
        "400":
          description: A guard rail fired (deleting yourself, the last administrator, or a user who still owns projects/runtimes — the error names the counts)
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: User not found
  /api/v1/users/{userID}/resources:
    get:
      summary: List the projects and runtimes a user owns (administrator only)
      tags: [Users]
      operationId: getUserResources
      security:
        - cookieAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's owned resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResources"
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: User not found
  /api/v1/users/{userID}/reassign:
    post:
      summary: Reassign owned projects/runtimes to another user (administrator only)
      description: >
        A runtime transfer only changes created_by — the enrollment token and
        live connection are untouched. Absent project_ids/runtime_ids fields
        leave that kind alone; an empty array moves everything of that kind;
        a non-empty array moves just those IDs.
      tags: [Users]
      operationId: reassignUserResources
      security:
        - cookieAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserReassign"
      responses:
        "200":
          description: Ownership transferred; the response reports how many of each kind moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: integer
                  runtimes:
                    type: integer
        "400":
          description: target_user_id missing or equal to the source user
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Source or target user not found
  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags: [Auth]
      operationId: listSessions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
  /api/v1/auth/sessions/{sessionID}:
    delete:
      summary: Revoke one of the current user's sessions
      tags: [Auth]
      operationId: revokeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked
        "401":
          description: Not authenticated
        "404":
          description: Session not found
  /api/v1/runtimes:
    get:
      summary: List registered runtimes
      description: Open to any authenticated user, so a Project can be created with a runtime selected from this list.
      tags: [Runtimes]
      operationId: listRuntimes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Registered runtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Runtime"
        "401":
          description: Not authenticated
    post:
      summary: Register a new runtime and issue its enrollment token
      tags: [Runtimes]
      operationId: createRuntime
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Runtime registered; token shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWithToken"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
  /api/v1/runtimes/{runtimeID}/revoke:
    post:
      summary: Revoke a runtime, preventing further connections
      tags: [Runtimes]
      operationId: revokeRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Runtime revoked
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Runtime not found
  /api/v1/runtimes/{runtimeID}/reactivate:
    post:
      summary: Re-enable a revoked runtime so it can reconnect with its existing enrollment token
      tags: [Runtimes]
      operationId: reactivateRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Runtime reactivated (returned to pending status; no new token is issued)
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Runtime not found
  /api/v1/runtimes/{runtimeID}:
    delete:
      summary: Delete a runtime record entirely (administrator only)
      description: >
        Unlike revoke, this is permanent: the record and its enrollment
        token's hash are removed and a live agent's connection is dropped
        immediately (the agent can no longer reconnect). A runtime whose
        projects still reference it cannot be deleted.
      tags: [Runtimes]
      operationId: deleteRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Runtime deleted
        "400":
          description: The runtime still has projects referencing it — delete or re-point them first
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Runtime not found
  /api/v1/runtimes/{runtimeID}/browse:
    get:
      summary: List a directory under a runtime's home directory
      description: >
        For the Project setup UI's directory picker, used before a Project
        exists. Every call is a live RPC to the runtime (the same
        file.command the Files endpoints use), rooted at the runtime's
        reported home directory instead of a Project's working directory.
        Open to any authenticated user, matching GET /runtimes' visibility —
        runtimes are shared infrastructure, not owned per-user. See
        docs/PROTOCOL.md.
      tags: [Runtimes]
      operationId: browseRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Directory to list, relative to the runtime's home directory. "." lists the home directory itself.
          schema:
            type: string
      responses:
        "200":
          description: The directory's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileInfo"
        "400":
          description: Invalid path (empty, absolute, or escaping the home directory)
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not read the directory
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/runtimes/{runtimeID}/browse/search:
    get:
      summary: Search directory names under a runtime's home directory
      description: >
        Case-insensitive name-substring search over the subtree rooted at
        path, restricted to directories. For the Project setup UI's tree
        search box. Bounded by the same depth/match caps as
        /files/search. See docs/PROTOCOL.md.
      tags: [Runtimes]
      operationId: browseRuntimeSearch
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Subtree to search, relative to the runtime's home directory. "." searches the whole home directory.
          schema:
            type: string
      responses:
        "200":
          description: Root-relative paths of matching directories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid path (empty, absolute, or escaping the home directory), or empty q
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not search the directory
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/runtimes/{runtimeID}/browse/mkdir:
    post:
      summary: Create a directory under a runtime's home directory
      description: For the directory picker's "new folder" action. Fails if the directory already exists.
      tags: [Runtimes]
      operationId: browseRuntimeMkdir
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Directory to create, relative to the runtime's home directory.
      responses:
        "204":
          description: Created
        "400":
          description: Invalid or missing path
        "401":
          description: Not authenticated
        "404":
          description: Runtime not found
        "409":
          description: The runtime is offline, or has not reported a home directory yet
        "502":
          description: The runtime could not create the directory (e.g. it already exists)
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects:
    get:
      summary: List all projects on the server
      description: Every authenticated user sees every project; edit/delete remain restricted to the owning user or an administrator.
      tags: [Projects]
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All projects on the server
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
    post:
      summary: Create a project
      tags: [Projects]
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFields"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body; the referenced runtime does not exist or is revoked; shell is not in the runtime's reported shells; or working_directory is not contained in (or does not exist under) the runtime's home_dir
        "401":
          description: Not authenticated
        "409":
          description: The referenced runtime is offline, or has not reported a home directory yet
  /api/v1/projects/{projectID}:
    get:
      summary: Get a project
      tags: [Projects]
      operationId: getProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
        "404":
          description: Project not found
    patch:
      summary: Update a project
      tags: [Projects]
      operationId: updateProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body; the referenced runtime does not exist or is revoked; shell is not in the runtime's reported shells; or working_directory is not contained in (or does not exist under) the runtime's home_dir
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime (whether or not runtime_id changed in this request) is offline, or has not reported a home directory yet — re-checked on every patch, not only when runtime-derived fields change
    delete:
      summary: Delete a project
      tags: [Projects]
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
  /api/v1/projects/{projectID}/editor/state:
    get:
      summary: Get the signed-in user's stored editor tab state
      tags: [Editor]
      operationId: getProjectEditorState
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The stored state, or an empty object when nothing is stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: object
                    additionalProperties: true
        "401":
          description: Not authenticated
        "404":
          description: Project not found or not owned by the caller
    put:
      summary: Store the signed-in user's editor tab state (opaque JSON object)
      tags: [Editor]
      operationId: putProjectEditorState
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: object
                  additionalProperties: true
      responses:
        "204":
          description: Stored
        "400":
          description: Invalid JSON
        "401":
          description: Not authenticated
        "404":
          description: Project not found or not owned by the caller
        "413":
          description: State exceeds 256 KiB
  /api/v1/projects/{projectID}/editor/stream:
    get:
      summary: Live editing stream (WebSocket)
      description: |
        Cookie-authenticated WebSocket for the Code tab's editor: browser
        sends {open|watch|save} messages, server replies {content|saved|
        stale|deleted|error} and pushes external changes. Message shapes in
        docs/API.md "Editor (Code tab)" and docs/PROTOCOL.md.
      tags: [Editor]
      operationId: openProjectEditorStream
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switched to the editor stream protocol
        "401":
          description: Not authenticated
        "404":
          description: Project not found or not owned by the caller
        "409":
          description: Runtime is offline
  /api/v1/projects/{projectID}/sessions:
    get:
      summary: List a project's terminal sessions
      tags: [Sessions]
      operationId: listProjectSessions
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Project not found
    post:
      summary: Create a terminal session (starts a real PTY on the project's runtime)
      description: |
        Synchronously sends session.open to the project's runtime and waits
        up to 10s for it to start. See docs/API.md "Sessions" for the
        status lifecycle and error responses.
      tags: [Sessions]
      operationId: createSession
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSessionFields"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime rejected session.open, or it could not be dispatched
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/sessions/{sessionID}:
    get:
      summary: Get a terminal session
      tags: [Sessions]
      operationId: getSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Session not found
    patch:
      summary: Rename a terminal session
      tags: [Sessions]
      operationId: renameSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Session renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Session not found
    delete:
      summary: Close a terminal session
      description: Sends session.close to the runtime (best-effort) and marks the session closed, a terminal status.
      tags: [Sessions]
      operationId: closeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session closed
        "401":
          description: Not authenticated
        "404":
          description: Session not found
  /api/v1/sessions/{sessionID}/attach:
    post:
      summary: Confirm a session can be attached to
      description: Does not itself stream bytes — opening the WSS stream is what attaches a browser. This just validates the session is still live before a client opens it.
      tags: [Sessions]
      operationId: attachSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
