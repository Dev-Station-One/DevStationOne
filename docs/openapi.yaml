  /api/v1/projects/{projectID}/files/content:
    get:
      summary: Read a file's bytes
      description: Returns the raw file with a Content-Type derived from the extension. `download=1` forces a Content-Disposition attachment; HTML/SVG always get an attachment disposition. Files larger than the 24 MB transfer limit are rejected.
      tags: [Files]
      operationId: readFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The file's bytes
          content:
            application/octet-stream: {}
        "400":
          description: Invalid path, or the path names a directory
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not read the file, or it exceeds the transfer limit
        "504":
          description: The runtime did not respond within the timeout
    put:
      summary: Write or upload a file
      description: The raw request body is the file's bytes. Creates the file (0644) when absent, replaces it when present. Limited to 24 MB.
      tags: [Files]
      operationId: writeFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Written
        "400":
          description: Invalid path
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "413":
          description: Body exceeds the 24 MB upload limit
        "502":
          description: The runtime could not write the file
        "504":
          description: The runtime did not respond within the timeout
