openapi: 3.1.0
info:
  title: DevStation API
  version: 0.1.0
  description: |
    OpenAPI contract for the DevStation self-hosted remote development platform.
    This file is intentionally minimal at repository creation. Each implementation
    slice must expand it with the real contract before that slice is marked complete.
servers:
  - url: /
security: []
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Runtimes
  - name: Projects
  - name: Sessions
  - name: Files
  - name: Databases
  - name: Services
  - name: Audit
paths:
  /healthz:
    get:
      summary: Liveness check
      tags: [Health]
      operationId: health
      responses:
        "200":
          description: Healthy
  /readyz:
    get:
      summary: Readiness check
      tags: [Health]
      operationId: readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
        "401":
          description: Invalid email or password
  /api/v1/auth/logout:
    post:
      summary: Log out and destroy the current session
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Logged out
  /api/v1/auth/session:
    get:
      summary: Get the current authenticated user
      tags: [Auth]
      operationId: getCurrentSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags: [Auth]
      operationId: listSessions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
  /api/v1/auth/sessions/{sessionID}:
    delete:
      summary: Revoke one of the current user's sessions
      tags: [Auth]
      operationId: revokeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked
        "401":
          description: Not authenticated
        "404":
          description: Session not found
  /api/v1/runtimes:
    get:
      summary: List registered runtimes
      description: Open to any authenticated user, so a Project can be created with a runtime selected from this list.
      tags: [Runtimes]
      operationId: listRuntimes
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Registered runtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Runtime"
        "401":
          description: Not authenticated
    post:
      summary: Register a new runtime and issue its enrollment token
      tags: [Runtimes]
      operationId: createRuntime
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Runtime registered; token shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWithToken"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
  /api/v1/runtimes/{runtimeID}/revoke:
    post:
      summary: Revoke a runtime, preventing further connections
      tags: [Runtimes]
      operationId: revokeRuntime
      security:
        - cookieAuth: []
      parameters:
        - name: runtimeID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Runtime revoked
        "401":
          description: Not authenticated
        "403":
          description: Administrator access required
        "404":
          description: Runtime not found
  /api/v1/projects:
    get:
      summary: List projects visible to the current user
      description: Administrators see every project; other users see only projects they created.
      tags: [Projects]
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
    post:
      summary: Create a project
      tags: [Projects]
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFields"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body, or the referenced runtime does not exist or is revoked
        "401":
          description: Not authenticated
  /api/v1/projects/{projectID}:
    get:
      summary: Get a project
      tags: [Projects]
      operationId: getProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    patch:
      summary: Update a project
      tags: [Projects]
      operationId: updateProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request body, or the referenced runtime does not exist or is revoked
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    delete:
      summary: Delete a project
      tags: [Projects]
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
  /api/v1/projects/{projectID}/sessions:
    get:
      summary: List a project's terminal sessions
      tags: [Sessions]
      operationId: listProjectSessions
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
    post:
      summary: Create a terminal session (starts a real PTY on the project's runtime)
      description: |
        Synchronously sends session.open to the project's runtime and waits
        up to 10s for it to start. See docs/API.md "Sessions" for the
        status lifecycle and error responses.
      tags: [Sessions]
      operationId: createSession
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSessionFields"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Project not found, or not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime rejected session.open, or it could not be dispatched
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/sessions/{sessionID}:
    get:
      summary: Get a terminal session
      tags: [Sessions]
      operationId: getSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
    patch:
      summary: Rename a terminal session
      tags: [Sessions]
      operationId: renameSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Session renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Invalid request body
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
    delete:
      summary: Close a terminal session
      description: Sends session.close to the runtime (best-effort) and marks the session closed, a terminal status.
      tags: [Sessions]
      operationId: closeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session closed
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
  /api/v1/sessions/{sessionID}/attach:
    post:
      summary: Confirm a session can be attached to
      description: Does not itself stream bytes — opening the WSS stream is what attaches a browser. This just validates the session is still live before a client opens it.
      tags: [Sessions]
      operationId: attachSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session is live and can be attached to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: Session is exited, failed, or closed
  /api/v1/sessions/{sessionID}/detach:
    post:
      summary: Force-disconnect whichever browser is currently attached
      description: The session (and its process) is unaffected; a future attach still sees buffered scrollback.
      tags: [Sessions]
      operationId: detachSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Detached
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
  /api/v1/sessions/{sessionID}/resize:
    post:
      summary: Resize a session's PTY
      tags: [Sessions]
      operationId: resizeSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                rows:
                  type: integer
      responses:
        "204":
          description: Resized
        "400":
          description: cols/rows must be positive integers
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: Failed to reach the runtime
  /api/v1/sessions/{sessionID}/signal:
    post:
      summary: Send a POSIX signal to a session's process
      description: For explicit process control (e.g. a "Force stop" action). Normal input, including Ctrl+C/Ctrl+D as bytes, goes through the WSS stream instead.
      tags: [Sessions]
      operationId: signalSession
      security:
        - cookieAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [SIGINT, SIGTERM, SIGKILL, SIGHUP, SIGQUIT, SIGTSTP, SIGCONT]
      responses:
        "204":
          description: Signal sent
        "400":
          description: Unsupported signal
        "401":
          description: Not authenticated
        "404":
          description: Session not found, or its project is not owned by the current user
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: Failed to reach the runtime
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: devstation_session
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: [string, "null"]
    User:
      type: object
      required: [id, email, is_admin, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, user_agent, ip_address, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    RuntimeCapabilities:
      type: object
      properties:
        terminal:
          type: boolean
        filesystem:
          type: boolean
        services:
          type: boolean
        databases:
          type: array
          items:
            type: string
    Runtime:
      type: object
      required: [id, name, hostname, os, arch, runtime_version, capabilities, status, online, enrolled_at, last_seen_at, revoked_at, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        runtime_version:
          type: string
        capabilities:
          $ref: "#/components/schemas/RuntimeCapabilities"
        status:
          type: string
          enum: [pending, online, offline, revoked]
        online:
          type: boolean
          description: Whether the runtime currently has a live connection.
        enrolled_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    RuntimeWithToken:
      allOf:
        - $ref: "#/components/schemas/Runtime"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw enrollment token, shown exactly once.
    ProjectFields:
      type: object
      required: [name, runtime_id, os_user, working_directory, shell]
      properties:
        name:
          type: string
        runtime_id:
          type: string
        os_user:
          type: string
          description: OS user the runtime executes this Project's sessions as.
        working_directory:
          type: string
          description: Absolute path used as the authoritative session working directory.
        shell:
          type: string
          description: Absolute path to the shell binary used for interactive sessions.
        environment:
          type: object
          additionalProperties:
            type: string
          description: Environment variables applied to the Project's sessions.
    ProjectPatch:
      type: object
      description: Same properties as ProjectFields; only the fields present in the request are changed.
      properties:
        name:
          type: string
        runtime_id:
          type: string
        os_user:
          type: string
        working_directory:
          type: string
        shell:
          type: string
        environment:
          type: object
          additionalProperties:
            type: string
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectFields"
        - type: object
          required: [id, created_by, created_at, updated_at]
          properties:
            id:
              type: string
            created_by:
              type: string
              description: ID of the user who owns this project.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    TerminalSessionFields:
      type: object
      required: [name]
      properties:
        name:
          type: string
        cols:
          type: integer
          default: 80
        rows:
          type: integer
          default: 24
    TerminalSession:
      type: object
      description: |
        A persistent PTY session running on its project's runtime. Named
        "TerminalSession" (not "Session") to avoid confusion with the
        unrelated browser-auth Session schema above (see ADR-015).
      required: [id, project_id, name, status, cols, rows, exit_code, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [requested, starting, running, detached, exited, failed, closed]
        cols:
          type: integer
        rows:
          type: integer
        exit_code:
          type: [integer, "null"]
        error:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
