          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The changed paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitFileStatus"
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime's git command failed (e.g. not a git repository)
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/git/diff:
    get:
      summary: Get a unified diff
      description: Defaults to the working-tree-vs-index diff; `staged=1` diffs the index against HEAD instead.
      tags: [Git]
      operationId: gitDiff
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Scope the diff to one path, relative to the Project's working directory. Omitted diffs the whole Project root.
          schema:
            type: string
        - name: staged
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The diff text
          content:
            application/json:
              schema:
                type: object
                required: [diff]
                properties:
                  diff:
