  /api/v1/projects/{projectID}/files/mode:
    patch:
      summary: Change an entry's permission bits
      description: Only the low 9 bits (owner/group/other rwx) are settable — setuid/setgid/sticky are dropped. `recursive` applies to every entry beneath `path` when it is a directory.
      tags: [Files]
      operationId: chmodFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, mode]
              properties:
                path:
                  type: string
                mode:
                  type: string
                  description: Octal permission string, e.g. "755".
                recursive:
                  type: boolean
      responses:
        "204":
          description: Permissions changed
        "400":
          description: Invalid or missing path/mode
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not change the entry's permissions
        "504":
          description: The runtime did not respond within the timeout
  /api/v1/projects/{projectID}/files/owner:
    patch:
      summary: Change an entry's owner and/or group
      description: |
        `owner`/`group` are account/group names, not numeric ids — see
        RuntimeCapabilities `users`/`groups`. Either may be omitted to leave
        that half unchanged. `recursive` applies to every entry beneath
        `path` when it is a directory.

        The runtime never runs as root (docs/DECISIONS.md ADR-032), so the
        OS itself will reject changing the owning user in the overwhelming
        majority of deployments — `group` succeeds for any group the
        runtime's OS user belongs to. A rejection surfaces as `502`.
      tags: [Files]
      operationId: chownFile
      security:
        - cookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                owner:
                  type: string
                group:
                  type: string
                recursive:
                  type: boolean
      responses:
        "204":
          description: Owner/group changed
        "400":
          description: Invalid or missing path, or neither owner nor group given
        "401":
          description: Not authenticated
        "404":
          description: Project not found
        "409":
          description: The project's runtime is not currently connected
        "502":
          description: The runtime could not change the entry's owner/group (e.g. unknown name, or the OS rejected it)
        "504":
          description: The runtime did not respond within the timeout
