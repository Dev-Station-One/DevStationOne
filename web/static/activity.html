<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · DevStationOne</title>
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/apple-touch-180.png">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B1220" />
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css">
  <script>document.documentElement.setAttribute('data-bs-theme', (function () { try { return window.localStorage.getItem('ds-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })());</script>
  <script>try { if (window.localStorage.getItem('tabler-sidebar') !== 'default') document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover'); } catch (e) { document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover'); }</script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="ds-sidebar" data-active="activity"></aside>
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-fluid">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="mb-0"><i class="fa-solid fa-list-check" aria-hidden="true"></i> Activity</h2>
            <button type="button" class="icon-btn" data-help="activity" aria-label="Help: Activity" title="Help: Activity"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></button>
          </div>

          <div id="forbidden" class="empty" hidden>
            <div class="empty-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></div>
            <div class="empty-title">Administrator access required</div>
            <div class="empty-subtitle text-secondary">Only administrators can view the audit log.</div>
          </div>

          <div id="activity-content">
            <div class="card mb-4">
              <div class="card-body">
                <h3 class="card-title">Retention policy</h3>
                <div class="row g-2 align-items-end">
                  <div class="col-auto">
                    <label class="form-label">Keep audit events for (days)</label>
                    <input id="retention-days" type="number" min="0" class="form-control" style="width: 10rem">
                    <div class="form-hint">0 = keep forever</div>
                  </div>
                  <div class="col-auto">
                    <button id="save-retention-btn" class="btn btn-primary">Save</button>
                  </div>
                </div>
                <div id="retention-error" class="alert alert-danger mt-3" hidden></div>
              </div>
            </div>

            <div class="card mb-4">
              <div class="card-body">
                <h3 class="card-title">Filters</h3>
                <div class="row g-2 align-items-end">
                  <div class="col-auto">
                    <label class="form-label">Event type</label>
                    <select id="filter-event-type" class="form-select">
                      <option value="">All</option>
                      <optgroup label="Authentication">
                        <option value="auth.login">Login succeeded</option>
                        <option value="auth.login_failed">Login failed</option>
                        <option value="auth.logout">Logout</option>
                      </optgroup>
                      <optgroup label="Runtimes">
                        <option value="runtime.registered">Runtime registered</option>
                        <option value="runtime.revoked">Runtime revoked</option>
                      </optgroup>
                      <optgroup label="Projects">
                        <option value="project.created">Project created</option>
                        <option value="project.updated">Project updated</option>
                        <option value="project.deleted">Project deleted</option>
                      </optgroup>
                      <optgroup label="Sessions">
                        <option value="session.created">Session created</option>
                        <option value="session.terminated">Session terminated</option>
                      </optgroup>
                      <optgroup label="Databases">
                        <option value="database_connection.created">Connection created</option>
                        <option value="database_connection.updated">Connection updated</option>
                        <option value="database_connection.deleted">Connection deleted</option>
                        <option value="database_principal.created">Principal created</option>
                        <option value="database_principal.deleted">Principal deleted</option>
                        <option value="database_principal.password_changed">Principal password changed</option>
                        <option value="database_grant.granted">Privilege granted</option>
                        <option value="database_grant.revoked">Privilege revoked</option>
                      </optgroup>
                      <optgroup label="Services">
                        <option value="service.action">Service action</option>
                      </optgroup>
                      <optgroup label="Files">
                        <option value="file.created">File created</option>
                        <option value="file.mkdir">Directory created</option>
                        <option value="file.written">File written</option>
                        <option value="file.transferred">File renamed/copied/moved</option>
                        <option value="file.deleted">File deleted</option>
                      </optgroup>
                    </select>
                  </div>
                  <div class="col-auto">
                    <label class="form-label">Since</label>
                    <input id="filter-since" type="datetime-local" class="form-control">
                  </div>
                  <div class="col-auto">
                    <label class="form-label">Until</label>
                    <input id="filter-until" type="datetime-local" class="form-control">
                  </div>
                  <div class="col-auto">
                    <button id="apply-filters-btn" class="btn btn-primary">Apply</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="table-responsive">
                <table class="table card-table table-vcenter">
                  <thead>
                    <tr>
                      <th>Time</th>
                      <th>Event</th>
                      <th>Actor</th>
                      <th>Resource</th>
                      <th>IP address</th>
                      <th>Detail</th>
                    </tr>
                  </thead>
                  <tbody id="events-body"></tbody>
                </table>
              </div>
              <div id="events-empty" class="empty" hidden>
                <div class="empty-icon"><i class="fa-solid fa-list-check" aria-hidden="true"></i></div>
                <div class="empty-title">No matching events</div>
              </div>
              <div class="card-footer d-flex align-items-center justify-content-between">
                <div id="events-summary" class="text-secondary"></div>
                <div class="btn-group">
                  <button id="prev-page-btn" class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Newer</button>
                  <button id="next-page-btn" class="btn btn-outline-secondary">Older <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/vendor/bootstrap/js/popover/index.js"></script>
  <script src="/vendor/bootstrap/js/popover/data.js"></script>
  <script src="/vendor/bootstrap/js/popover/manipulator.js"></script>
  <script src="/vendor/bootstrap/js/popover/event-handler.js"></script>
  <script src="/vendor/bootstrap/js/popover/selector-engine.js"></script>
  <script src="/vendor/bootstrap/js/popover/config.js"></script>
  <script src="/vendor/bootstrap/js/popover/sanitizer.js"></script>
  <script src="/vendor/bootstrap/js/popover/template-factory.js"></script>
  <script src="/vendor/bootstrap/js/popover/base-component.js"></script>
  <script src="/vendor/bootstrap/js/popover/popper.min.js"></script>
  <script>window['@popperjs/core'] = window.Popper;</script>
  <script src="/vendor/bootstrap/js/popover/tooltip.js"></script>
  <script src="/vendor/bootstrap/js/popover/popover.js"></script>
  <script src="/js/help.js"></script>
  <script>
    var PAGE_SIZE = 50;
    var offset = 0;

    function escapeHtml(s) {
      return $('<div>').text(s == null ? '' : s).html();
    }

    function showForbidden() {
      $('#activity-content').prop('hidden', true);
      $('#forbidden').prop('hidden', false);
    }

    function loadSettings() {
      $.get('/api/v1/audit/settings').done(function (s) {
        $('#retention-days').val(s.retention_days);
      }).fail(function (xhr) {
        if (xhr.status === 401) {
          window.location.href = '/login.html';
        } else if (xhr.status === 403) {
          showForbidden();
        }
      });
    }

    function currentFilters() {
      var params = { limit: PAGE_SIZE, offset: offset };
      var eventType = $('#filter-event-type').val();
      if (eventType) params.event_type = eventType;
      var since = $('#filter-since').val();
      if (since) params.since = new Date(since).toISOString();
      var until = $('#filter-until').val();
      if (until) params.until = new Date(until).toISOString();
      return params;
    }

    function loadEvents() {
      $.get('/api/v1/audit', currentFilters()).done(function (body) {
        var events = body.events || [];
        var $body = $('#events-body').empty();
        $('#events-empty').prop('hidden', events.length > 0);
        events.forEach(function (e) {
          var resource = [e.resource_type, e.resource_id].filter(Boolean).join(' ') || '—';
          var detail = '';
          try { detail = JSON.stringify(e.detail || {}); } catch (err) { detail = ''; }
          $body.append(
            '<tr><td>' + new Date(e.occurred_at).toLocaleString() + '</td>' +
            '<td><code>' + escapeHtml(e.event_type) + '</code></td>' +
            '<td>' + escapeHtml(e.actor_email || '—') + '</td>' +
            '<td>' + escapeHtml(resource) + '</td>' +
            '<td>' + escapeHtml(e.ip_address || '—') + '</td>' +
            '<td class="text-secondary text-truncate" style="max-width: 20rem" title="' + escapeHtml(detail) + '">' + escapeHtml(detail) + '</td></tr>'
          );
        });
        var shown = offset + events.length;
        $('#events-summary').text(body.total + ' total, showing ' + (events.length ? (offset + 1) : 0) + '–' + shown);
        $('#prev-page-btn').prop('disabled', offset === 0);
        $('#next-page-btn').prop('disabled', shown >= body.total);
      }).fail(function (xhr) {
        if (xhr.status === 401) {
          window.location.href = '/login.html';
        } else if (xhr.status === 403) {
          showForbidden();
        }
      });
    }

    $('#apply-filters-btn').on('click', function () {
      offset = 0;
      loadEvents();
    });

    $('#prev-page-btn').on('click', function () {
      offset = Math.max(0, offset - PAGE_SIZE);
      loadEvents();
    });

    $('#next-page-btn').on('click', function () {
      offset = offset + PAGE_SIZE;
      loadEvents();
    });

    $('#save-retention-btn').on('click', function () {
      var days = parseInt($('#retention-days').val(), 10);
      $('#retention-error').prop('hidden', true);
      if (isNaN(days) || days < 0) {
        $('#retention-error').text('Enter a non-negative number of days.').prop('hidden', false);
        return;
      }
      $.ajax({
        url: '/api/v1/audit/settings',
        method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({ retention_days: days })
      }).done(function (s) {
        $('#retention-days').val(s.retention_days);
      }).fail(function (xhr) {
        var msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Failed to save retention policy.';
        $('#retention-error').text(msg).prop('hidden', false);
      });
    });

    loadSettings();
    loadEvents();
  </script>
</body>
</html>
