  <link rel="stylesheet" href="/css/app.css">

    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">

          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand d-flex align-items-center">

        </h1>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item"><div class="text-uppercase text-secondary small fw-bold px-3 pt-3 pb-1">Workspace</div></li>
            <li class="nav-item active"><a class="nav-link" href="/"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Dashboard</a></li>

              <div class="dropdown-menu dropdown-menu-end">

  <script>
    $.get('/api/v1/auth/session').fail(function () {
      window.location.href = '/login.html';
    });

    $('#logout-btn').on('click', function () {
      $.ajax({ url: '/api/v1/auth/logout', method: 'POST' }).always(function () {
        window.location.href = '/login.html';
      });
    });
  </script>
