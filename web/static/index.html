<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevStationOne</title>
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-256.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css">
  <script>document.documentElement.setAttribute('data-bs-theme', (function () { try { return window.localStorage.getItem('ds-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })());</script>
  <script>try { if (window.localStorage.getItem('tabler-sidebar') !== 'default') document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover'); } catch (e) { document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover'); }</script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="ds-sidebar" data-active="dashboard"></aside>
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-fluid">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="mb-0"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Dashboard</h2>
            <button type="button" class="icon-btn" data-help="dashboard" aria-label="Help: Dashboard" title="Help: Dashboard"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></button>
          </div>

          <div class="row row-deck row-cards">
            <div class="col-12 col-lg-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="fa-solid fa-cubes" aria-hidden="true"></i> Active Projects</h3>
                </div>
                <div class="table-responsive">
                  <table class="table card-table table-vcenter">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Runtime</th>
                        <th>Sessions</th>
                      </tr>
                    </thead>
                    <tbody id="dash-projects-body"></tbody>
                  </table>
                </div>
                <div id="dash-projects-empty" class="empty" hidden>
                  <div class="empty-icon"><i class="fa-solid fa-cubes" aria-hidden="true"></i></div>
                  <div class="empty-title">No projects yet</div>
                  <div class="empty-subtitle text-secondary"><a href="/projects.html">Create a Project</a> to get started.</div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="fa-solid fa-server" aria-hidden="true"></i> Runtimes</h3>
                </div>
                <div class="table-responsive">
                  <table class="table card-table table-vcenter">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Host</th>
                      </tr>
                    </thead>
                    <tbody id="dash-runtimes-body"></tbody>
                  </table>
                </div>
                <div id="dash-runtimes-empty" class="empty" hidden>
                  <div class="empty-icon"><i class="fa-solid fa-server" aria-hidden="true"></i></div>
                  <div class="empty-title">No runtimes registered</div>
                  <div class="empty-subtitle text-secondary"><a href="/runtimes.html">Register a Development Runtime</a> to get started.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/vendor/bootstrap/js/popover/index.js"></script>
  <script src="/vendor/bootstrap/js/popover/data.js"></script>
  <script src="/vendor/bootstrap/js/popover/manipulator.js"></script>
  <script src="/vendor/bootstrap/js/popover/event-handler.js"></script>
  <script src="/vendor/bootstrap/js/popover/selector-engine.js"></script>
  <script src="/vendor/bootstrap/js/popover/config.js"></script>
  <script src="/vendor/bootstrap/js/popover/sanitizer.js"></script>
  <script src="/vendor/bootstrap/js/popover/template-factory.js"></script>
  <script src="/vendor/bootstrap/js/popover/base-component.js"></script>
  <script src="/vendor/bootstrap/js/popover/popper.min.js"></script>
  <script>window['@popperjs/core'] = window.Popper;</script>
  <script src="/vendor/bootstrap/js/popover/tooltip.js"></script>
  <script src="/vendor/bootstrap/js/popover/popover.js"></script>
  <script src="/js/help.js"></script>
  <script>
    $.get('/api/v1/auth/session').fail(function () {
      window.location.href = '/login.html';
    });

    function escapeHtml(s) {
      return $('<div>').text(s).html();
    }

    function runtimeStatusBadge(rt) {
      if (rt.status === 'revoked') return '<span class="badge bg-red-lt">revoked</span>';
      if (rt.status === 'pending') return '<span class="badge bg-secondary-lt">pending enrollment</span>';
      if (rt.online) return '<span class="badge bg-green-lt">online</span>';
      return '<span class="badge bg-yellow-lt">offline</span>';
    }

    // The dashboard is a live glance, not the management view: only
    // currently-connected runtimes are listed here. Pending/offline/revoked
    // runtimes stay visible on the full Runtimes page (runtimes.html).
    function loadRuntimes() {
      $.get('/api/v1/runtimes').done(function (runtimes) {
        var online = runtimes.filter(function (rt) { return rt.online; });
        var $body = $('#dash-runtimes-body').empty();
        $('#dash-runtimes-empty').prop('hidden', online.length > 0);
        if (online.length === 0) {
          $('#dash-runtimes-empty .empty-title').text(runtimes.length > 0 ? 'No runtimes online' : 'No runtimes registered');
          $('#dash-runtimes-empty .empty-subtitle').html(runtimes.length > 0
            ? 'Start a runtime to see it here — check status on <a href="/runtimes.html">Runtimes</a>.'
            : '<a href="/runtimes.html">Register a Development Runtime</a> to get started.');
        }
        online.forEach(function (rt) {
          $body.append(
            '<tr><td>' + escapeHtml(rt.name) + '</td>' +
            '<td>' + runtimeStatusBadge(rt) + '</td>' +
            '<td>' + escapeHtml(rt.hostname || '—') + '</td></tr>'
          );
        });
      }).fail(function (xhr) {
        if (xhr.status === 401) window.location.href = '/login.html';
      });
    }

    // Projects are recency-sorted by the API (created_at desc); the
    // dashboard shows them as-is rather than re-sorting by activity
    // (docs/IMPLEMENTATION_PLAN.md Slice 14).
    function loadProjects() {
      $.get('/api/v1/runtimes').done(function (runtimes) {
        var runtimeNames = {};
        runtimes.forEach(function (rt) { runtimeNames[rt.id] = rt.name; });

        $.get('/api/v1/projects').done(function (projects) {
          var $body = $('#dash-projects-body').empty();
          $('#dash-projects-empty').prop('hidden', projects.length > 0);
          projects.forEach(function (p) {
            var sessionsBadge = p.active_sessions > 0
              ? '<span class="badge bg-green-lt">' + p.active_sessions + '</span>'
              : '<span class="badge bg-secondary-lt">0</span>';
            $body.append(
              '<tr class="project-row" data-id="' + p.id + '" style="cursor:pointer">' +
              '<td>' + escapeHtml(p.name) + '</td>' +
              '<td>' + escapeHtml(runtimeNames[p.runtime_id] || p.runtime_id) + '</td>' +
              '<td>' + sessionsBadge + '</td></tr>'
            );
          });
        }).fail(function (xhr) {
          if (xhr.status === 401) window.location.href = '/login.html';
        });
      });
    }

    $('#dash-projects-body').on('click', '.project-row', function () {
      window.location.href = '/project.html?id=' + $(this).data('id');
    });

    // Live updates: the events stream only signals that something changed
    // (runtime online/offline, a project's session activity) — the
    // dashboard just refetches both lists rather than patching individual
    // rows, which is simpler and plenty fast for a low-frequency channel
    // like this one. The connection itself is shared page-wide by
    // app.js (also used by the notifications bell); this just reacts to it.
    document.addEventListener('ds-ws-event', function (evt) {
      var msg = evt.detail || {};
      if (msg.type === 'runtime.status') loadRuntimes();
      if (msg.type === 'project.status') loadProjects();
    });

    loadRuntimes();
    loadProjects();
  </script>
</body>
</html>
