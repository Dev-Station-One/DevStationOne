<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevStationOne</title>
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-256.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css">
  <script>document.documentElement.setAttribute('data-bs-theme', (function () { try { return window.localStorage.getItem('ds-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })());</script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="ds-sidebar" data-active="dashboard"></aside>
    <div class="page-wrapper">
      <header class="navbar navbar-expand-md navbar-light d-print-none">
        <div class="container-xl d-flex justify-content-between align-items-center">
          <button class="icon-btn" type="button" data-bs-toggle="sidebar-folded" aria-label="Fold sidebar" title="Fold sidebar"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <div class="d-flex align-items-center gap-2">
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme"><i class="fa-solid fa-sun" aria-hidden="true"></i><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
            <div class="dropdown">
              <button class="icon-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu" title="Account"><i class="fa-solid fa-user" aria-hidden="true"></i></button>
              <div class="dropdown-menu dropdown-menu-end">
                <a class="dropdown-item" href="/account.html"><i class="fa-solid fa-user-gear" aria-hidden="true"></i> Account</a>
                <button class="dropdown-item" type="button" id="logout-btn"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Log out</button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="page-body">
        <div class="container-xl">
          <div class="empty">
            <div class="empty-icon"><i class="fa-solid fa-desktop fa-2x" aria-hidden="true"></i></div>
            <div class="empty-title">DevStationOne Control Server</div>
            <div class="empty-subtitle text-secondary">
              Create a Project to get started. Files, Databases, and Services arrive in later implementation slices.
            </div>
            <div class="empty-action">
              <a href="/projects.html" class="btn btn-primary">Go to Projects</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="/js/dialogs.js"></script>
  <script>
    $.get('/api/v1/auth/session').fail(function () {
      window.location.href = '/login.html';
    });

    $('#logout-btn').on('click', function () {
      $.ajax({ url: '/api/v1/auth/logout', method: 'POST' }).always(function () {
        window.location.href = '/login.html';
      });
    });
  </script>
</body>
</html>
