<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · DevStationOne</title>
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-256.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css">
  <script>document.documentElement.setAttribute('data-bs-theme', (function () { try { return window.localStorage.getItem('ds-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })());</script>
  <script>try { if (window.localStorage.getItem('tabler-sidebar') === 'folded-hover') document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover'); } catch (e) { /* private mode: fine */ }</script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="ds-sidebar" data-active=""></aside>
    <div class="page-wrapper">
      <header class="navbar navbar-expand-md navbar-light d-print-none">
        <div class="container-xl d-flex justify-content-between align-items-center">
          <button class="icon-btn" type="button" data-bs-toggle="sidebar-folded" aria-label="Fold sidebar" title="Fold sidebar"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
          <div class="d-flex align-items-center gap-2" id="ds-topbar-actions"></div>
        </div>
      </header>
      <div class="page-body">
        <div class="container-xl">
          <h2 class="mb-3"><i class="fa-solid fa-user" aria-hidden="true"></i> Account</h2>
          <div class="card mb-4">
            <div class="card-body">
              <div class="mb-1"><strong>Email:</strong> <span id="account-email">—</span></div>
              <div class="mb-1"><strong>Role:</strong> <span id="account-role">—</span></div>
              <form id="display-name-form" class="row g-2 align-items-end mt-1" autocomplete="off">
                <div class="col-12 col-md-6">
                  <label class="form-label mb-1" for="display-name-input">Display name</label>
                  <input id="display-name-input" class="form-control" maxlength="80" placeholder="Shown instead of your email (journal, future pages)">
                </div>
                <div class="col-12 col-md-4">
                  <button class="btn btn-primary" type="submit">Save</button>
                </div>
                <div class="col-12 small text-secondary" id="display-name-saved" hidden>Saved.</div>
              </form>
            </div>
          </div>

          <h3 class="mb-3">Active sessions</h3>
          <div class="card">
            <div class="table-responsive">
              <table class="table card-table table-vcenter">
                <thead>
                  <tr>
                    <th>Device / Agent</th>
                    <th>IP address</th>
                    <th>Last seen</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="sessions-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="/js/dialogs.js"></script>
  <script>
    function escapeHtml(s) {
      return $('<div>').text(s).html();
    }

    function loadAccount() {
      $.get('/api/v1/auth/session').done(function (user) {
        $('#account-email').text(user.email);
        $('#account-role').text(user.is_admin ? 'Administrator' : 'User');
        $('#display-name-input').val(user.display_name || '');
      }).fail(function () {
        window.location.href = '/login.html';
      });
    }

    $('#display-name-form').on('submit', function (e) {
      e.preventDefault();
      $.ajax({
        url: '/api/v1/auth/preferences',
        method: 'PUT',
        data: JSON.stringify({ display_name: $('#display-name-input').val() }),
        contentType: 'application/json'
      }).done(function () {
        $('#display-name-saved').prop('hidden', false);
      }).fail(function (xhr) {
        DS.error((xhr.responseJSON && xhr.responseJSON.error) || 'Failed to save display name.');
      });
    });

    function loadSessions() {
      $.get('/api/v1/auth/sessions').done(function (sessions) {
        var $body = $('#sessions-body').empty();
        sessions.forEach(function (s) {
          var revokeBtn = s.current
            ? '<span class="badge bg-green-lt">this device</span>'
            : '<button class="icon-btn text-danger revoke-btn" data-id="' + s.id + '" aria-label="Revoke session" title="Revoke session"><i class="fa-solid fa-ban" aria-hidden="true"></i></button>';
          $body.append(
            '<tr><td>' + escapeHtml(s.user_agent || 'Unknown') + '</td>' +
            '<td>' + escapeHtml(s.ip_address || '') + '</td>' +
            '<td>' + new Date(s.last_seen_at).toLocaleString() + '</td>' +
            '<td>' + revokeBtn + '</td></tr>'
          );
        });
      });
    }

    $('#sessions-body').on('click', '.revoke-btn', function () {
      var id = $(this).data('id');
      $.ajax({ url: '/api/v1/auth/sessions/' + id, method: 'DELETE' }).always(loadSessions);
    });

    loadAccount();
    loadSessions();
  </script>
</body>
</html>
