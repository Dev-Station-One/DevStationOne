<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DevStationOne</title>
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-256.png">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B1220" />
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css">
  <script>document.documentElement.setAttribute('data-bs-theme', (function () { try { return window.localStorage.getItem('ds-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } })());</script>
</head>
<body class="d-flex flex-column">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <img src="/assets/logo/devstationone-top-logo.png" alt="DevStationOne" class="ds-logo-full ds-logo-login">
      </div>
      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Sign in to your account</h2>
          <div id="login-error" class="alert alert-danger" hidden></div>
          <form id="login-form" autocomplete="on">
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" id="email" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <div id="turnstile-widget" class="mb-2"></div>
            <div class="form-footer">
              <button type="submit" id="login-submit" class="btn btn-primary w-100">Sign in</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="/js/dialogs.js"></script>
  <script>
    var turnstileToken = '';

    function turnstileLoadFailed() {
      turnstileToken = '';
      $('#login-error').text('Security check failed to load. Refresh the page, or contact your administrator.').prop('hidden', false);
      $('#login-submit').prop('disabled', true);
    }

    // Optional (docs/DECISIONS.md ADR-044): the endpoint reports enabled:false
    // when no site key is configured, and the form behaves exactly as before.
    $.get('/api/v1/auth/turnstile-config').done(function (cfg) {
      if (!cfg.enabled) return;
      $('#login-submit').prop('disabled', true);
      var script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      script.async = true;
      script.defer = true;
      script.onload = function () {
        window.turnstile.render('#turnstile-widget', {
          sitekey: cfg.site_key,
          theme: 'auto',
          callback: function (token) {
            turnstileToken = token;
            $('#login-submit').prop('disabled', false);
          },
          'expired-callback': function () {
            turnstileToken = '';
            $('#login-submit').prop('disabled', true);
          },
          'error-callback': turnstileLoadFailed
        });
      };
      script.onerror = turnstileLoadFailed;
      document.body.appendChild(script);
    });

    $('#login-form').on('submit', function (e) {
      e.preventDefault();
      $('#login-error').prop('hidden', true);
      $.ajax({
        url: '/api/v1/auth/login',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          email: $('#email').val(),
          password: $('#password').val(),
          turnstile_token: turnstileToken
        })
      }).done(function () {
        window.location.href = '/';
      }).fail(function (xhr) {
        var msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Sign in failed';
        $('#login-error').text(msg).prop('hidden', false);
      });
    });
  </script>
</body>
</html>
